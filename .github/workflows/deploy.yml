name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/design-system-setup-n13780, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch generated assets (Higgsfield CDN — the sandbox can't reach it)
        run: |
          mkdir -p public
          [ -f public/algo-mark.glb ] || curl -fsSL -o public/algo-mark.glb \
            "https://d3u0tzju9qaucj.cloudfront.net/7d051b5a-7bfe-49fe-a484-24e7b3a9458a/1c1af68d-ab67-45e9-8cde-715bd993287d.glb"
          [ -f public/statue.png ] || curl -fsSL -o public/statue.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3BHCD7igI1rNUgPcHwyKdHyLWCw/hf_20260706_225605_45d7a579-1b1a-439e-8a2a-495beb9b9a41.png"
          # crumble clip → re-encode every frame as a keyframe so it scrubs
          # smoothly under scroll (arbitrary currentTime seeks stay sharp)
          if [ ! -f public/crumble.mp4 ]; then
            curl -fsSL -o /tmp/crumble_src.mp4 \
              "https://d8j0ntlcm91z4.cloudfront.net/user_3BHCD7igI1rNUgPcHwyKdHyLWCw/hf_20260706_225624_2e68768d-383c-4b81-9cf6-422a9986d7ed.mp4"
            ffmpeg -y -i /tmp/crumble_src.mp4 -an -c:v libx264 -preset veryfast \
              -g 1 -keyint_min 1 -pix_fmt yuv420p -movflags +faststart public/crumble.mp4
          fi
          ls -la public/
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
