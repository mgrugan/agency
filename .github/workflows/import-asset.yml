name: Import asset

on:
  workflow_dispatch:
    inputs:
      url:
        description: "HTTPS URL of the asset to download"
        required: true
      path:
        description: "Repo path to write it to"
        required: true
        default: "public/algo-mark.glb"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download asset
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          case "$DEST" in
            *..*|/*) echo "invalid path"; exit 1 ;;
          esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL --max-filesize 104857600 -o "$DEST" "$URL"
          ls -la "$DEST"
          file "$DEST"
      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Add generated 3D asset ($DEST)"
          git push
