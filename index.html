<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        try {
          localStorage.removeItem("telos-theme"); // drop the old auto-persisted key
          var t = localStorage.getItem("telos-theme-mode");
          if (t !== "light" && t !== "dark") t = "dark"; // default to dark
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Telos Media — audiences engineered toward their end</title>
    <meta
      name="description"
      content="Telos Media operates 24 media brands reaching 45 million followers and 128M+ monthly impressions. Classical patience, modern reach — social growth for ambitious companies."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230c110e'/%3E%3Ctext x='50' y='72' font-family='Georgia,serif' font-size='64' fill='%2322C55E' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: Georgia, serif;
          color: #8a9990;
          background: #070a08;
        "
      >
        Telos Media
      </div>
    </div>
    <noscript>Telos Media requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
