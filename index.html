<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Always open in dark. Clear any legacy stored theme so no old value can
      // override the default; the toggle switches themes for the session only.
      (function () {
        try {
          localStorage.removeItem("telos-theme");
          localStorage.removeItem("telos-theme-mode");
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
    <title>Telos Media: audiences engineered toward their end</title>
    <meta
      name="description"
      content="Telos Media runs a network of 25 media brands reaching 46.8 million followers and 500M+ monthly impressions. Classical patience, modern reach: full-stack marketing for ambitious companies."
    />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: Georgia, serif;
          color: #8a9990;
          background: #070a08;
        "
      >
        Telos Media
      </div>
    </div>
    <noscript>Telos Media requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
